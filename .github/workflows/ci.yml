name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  skill-names:
    name: skill-names
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Test skill metadata, catalog generation and pre-commit
        run: python -m unittest discover -s scripts/tests -v
      - name: Check repository skill names
        run: python scripts/check-skill-names.py
      - name: Check generated skill catalog
        run: python scripts/generate-skill-catalog.py --check

  pr-single-commit:
    name: pr-single-commit
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require exactly one commit in the PR
        if: github.event_name == 'pull_request'
        env:
          PR_COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          if [ "$PR_COMMITS" != "1" ]; then
            echo "PR must contain exactly one commit; found: $PR_COMMITS. Amend or squash the task branch."
            exit 1
          fi
